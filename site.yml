---
site:
  title: Inner & Outer Loop Workshop
  url: https://github.com/mostmark/inner-outer-loop-workshop
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    # Workshop addition: derives OPENSHIFT_APPS_DOMAIN from OPENSHIFT_CONSOLE_URL in the browser.
    - path: partials/head-scripts.hbs
      contents: ./content/supplemental-ui/partials/head-scripts.hbs
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

asciidoc:
  extensions:
    - ./content/lib/tab-block.js

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false
    - require: ./content/lib/preserve-url-params-extension.js
    # Workshop addition: WORKSHOP_PART=all|inner|outer builds the whole guide or one part.
    - require: ./content/lib/workshop-part-extension.js

output:
  dir: ./www
